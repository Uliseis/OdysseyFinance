<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Odyssey Finance</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 0 16px;
         font: 17px -apple-system, system-ui, sans-serif; text-align: center;
         background: #0b2a2e; color: #fff; }
  p { opacity: .75; margin: 8px 0 24px; }
  a { display: inline-block; padding: 14px 24px; border-radius: 14px; font-weight: 600;
      background: #2fb3a6; color: #04201f; text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>Back to Odyssey Finance</h1>
  <p>Open the app to finish connecting your bank.</p>
  <a id="open" href="#">Open Odyssey Finance</a>
</main>
<script>
  // Bank apps that do SCA themselves open this redirect in Safari instead of the app's
  // auth session. Hand the query (code, state) to the app under its own scheme.
  var target = "odysseyfinance://" + location.host + location.pathname + location.search;
  document.getElementById("open").href = target;
  location.replace(target);
</script>
</body>
</html>
